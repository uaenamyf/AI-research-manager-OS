<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202124; color: #e8eaed; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .toolbar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #292a2d; border-bottom: 1px solid #3c4043; }
    button { border: 1px solid #5f6368; border-radius: 5px; background: #303134; color: inherit; padding: 4px 9px; cursor: pointer; }
    button:hover { background: #3c4043; }
    button:disabled { opacity: .45; cursor: default; }
    .page { min-width: 54px; text-align: center; }
    .zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .status { color: #bdc1c6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viewer { height: calc(100% - 42px); overflow: auto; padding: 18px; text-align: center; background: #202124; }
    .page-wrap { display: inline-block; margin: 0 auto 18px; background: white; box-shadow: 0 2px 12px #0008; line-height: 0; }
    canvas { display: block; }
    .error { margin: 48px auto; max-width: 520px; color: #f28b82; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="prev" type="button">上一页</button>
    <span id="page" class="page">- / -</span>
    <button id="next" type="button">下一页</button>
    <span id="status" class="status">正在加载 PDF…</span>
    <span class="zoom">
      <button id="zoomOut" type="button">−</button>
      <span id="zoomValue">100%</span>
      <button id="zoomIn" type="button">＋</button>
    </span>
  </div>
  <main id="viewer" aria-label="PDF pages"></main>
  <script type="module">
    import * as pdfjsLib from './pdf.js';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.js';

    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const viewer = document.getElementById('viewer');
    const pageLabel = document.getElementById('page');
    const status = document.getElementById('status');
    const zoomValue = document.getElementById('zoomValue');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let pdf = null;
    let pageNumber = 1;
    let scale = 1;

    function setButtons() {
      pageLabel.textContent = pdf ? `${pageNumber} / ${pdf.numPages}` : '- / -';
      prev.disabled = !pdf || pageNumber <= 1;
      next.disabled = !pdf || pageNumber >= pdf.numPages;
      zoomValue.textContent = `${Math.round(scale * 100)}%`;
    }

    async function renderPage() {
      if (!pdf) return;
      viewer.replaceChildren();
      status.textContent = `正在渲染第 ${pageNumber} 页…`;
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({ scale });
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.style.width = `${Math.ceil(viewport.width)}px`;
      canvas.style.height = `${Math.ceil(viewport.height)}px`;
      wrap.append(canvas);
      viewer.append(wrap);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      status.textContent = `${pdf.numPages} 页`;
      setButtons();
    }

    async function load() {
      if (!file) throw new Error('缺少 PDF 地址');
      pdf = await pdfjsLib.getDocument({ url: file }).promise;
      setButtons();
      await renderPage();
    }

    prev.onclick = () => { if (pageNumber > 1) { pageNumber -= 1; renderPage(); } };
    next.onclick = () => { if (pdf && pageNumber < pdf.numPages) { pageNumber += 1; renderPage(); } };
    document.getElementById('zoomOut').onclick = () => { scale = Math.max(.5, scale - .15); renderPage(); };
    document.getElementById('zoomIn').onclick = () => { scale = Math.min(3, scale + .15); renderPage(); };

    load().catch((error) => {
      status.textContent = 'PDF 加载失败';
      const message = document.createElement('p');
      message.className = 'error';
      message.textContent = `无法加载 PDF：${error?.message || error}`;
      viewer.append(message);
    });
  </script>
</body>
</html>
