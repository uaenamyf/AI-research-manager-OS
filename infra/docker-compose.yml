  # rabbitmq:
  #   image: rabbitmq:3.13-management
  #   container_name: researchos-rabbitmq
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
  #     RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
  #   ports:
  #     - "${RABBIT_PORT:-5672}:5672"      # AMQP
  #     - "${RABBIT_MGMT_PORT:-15672}:15672"  # 管理界面
  #   volumes:
  #     - rabbitdata:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 20s
  #   restart: unless-stopped

  # ────────────────────────────────────────────────────────────
  # 业务元数据库（MySQL）：DSH research-* bundle 直连（auth/project/folder/paper 等）
  # ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: researchos-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-researchos}
      MYSQL_USER: ${MYSQL_USER:-researchos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-researchos}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-researchos-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      # 首次初始化时执行建表脚本（仅空数据卷时执行一次；脚本随 infra 维护）
      - ./mysql-init/V1__init.sql:/docker-entrypoint-initdb.d/V1__init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-researchos-root}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
