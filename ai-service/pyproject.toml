[project]
name = "researchos-ai-service"
version = "0.1.0"
description = "ResearchOS AI Service - PDF 解析、LLM、RAG、Agent 工作流"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 配置管理
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 数据库（PostgreSQL + pgvector 向量库 / MySQL 业务元数据）
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "aiomysql>=0.2.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # RabbitMQ
    "aio-pika>=9.4.0",
    # PDF 解析
    "pymupdf>=1.24.0",
    # LLM
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    # HTTP 客户端（回调 backend）
    "httpx>=0.27.0",
    # 日志
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
