# ============================================================
# ResearchOS CD 工作流
# 功能：
#   1. push 到 main 时构建三个服务镜像并推送至 GitHub Container Registry
#   2. 可选：配置 DEPLOY_ENABLED=true + SSH secrets 后自动部署到服务器
# 说明：镜像 tag = git SHA 前 8 位 + latest
# ============================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 仓库名必须小写（GHCR 要求）：uaenamyf/AI-research-manager-OS -> ai-research-manager-os
  IMAGE_BASE: ghcr.io/uaenamyf/ai-research-manager-os

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 构建并推送镜像
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=$(echo ${GITHUB_SHA::8})" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.IMAGE_BASE }}/backend:${{ steps.meta.outputs.tag }}

      - name: Build & push ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/ai-service:latest
            ${{ env.IMAGE_BASE }}/ai-service:${{ steps.meta.outputs.tag }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:${{ steps.meta.outputs.tag }}

  # ────────────────────────────────────────────────────────────
  # Job 2: 部署到服务器（可选）
  # 启用方式（GitHub Repo Settings -> Secrets and variables）：
  #   variables: DEPLOY_ENABLED=true, DEPLOY_PATH=/opt/researchos
  #   secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            git pull --ff-only || true
            # 生产环境使用 CD 推送的镜像（docker-compose.prod.yml 覆盖 build 为 image 引用）
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --remove-orphans
            docker image prune -f
