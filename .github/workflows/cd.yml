# ============================================================
# ResearchOS CD 工作流
# 功能：push 到 main 时，可选部署到服务器（DSH 融合包形态）
# 说明：legacy backend/ai-service 已于 2026-08-19 移除，不再构建
#       backend / ai-service 容器镜像；应用层 = DSH 融合包
#       （deepseek-harness-master/packages/researchos/），由服务器
#       上的 scripts/dsh-gateway.sh 启动。
# 启用方式（GitHub Repo Settings -> Secrets and variables）：
#   variables: DEPLOY_ENABLED=true, DEPLOY_PATH=/opt/researchos
#   secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# ============================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 部署到服务器（可选）
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            git pull --ff-only || true
            # 数据库基础设施（postgres + mysql）
            docker compose -f infra/docker-compose.yml --env-file .env up -d
            # DSH 融合包（前端 + 业务 bundle + AI 管道，:3080）
            bash scripts/dsh-gateway.sh stop || true
            bash scripts/dsh-gateway.sh start
            docker image prune -f
