# ============================================================
# ResearchOS CI 工作流
# 功能：代码检查、单元测试、Docker 镜像构建
# ============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # 版本号统一管理
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  JAVA_VERSION: "21"

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Backend 测试（Java / Spring Boot）
  # ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Maven Test
        run: mvn test -B

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ────────────────────────────────────────────────────────────
  # Job 2: AI Service 测试（Python / FastAPI）
  # ────────────────────────────────────────────────────────────
  ai-service-test:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run pytest
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage
          path: ai-service/coverage.xml

  # ────────────────────────────────────────────────────────────
  # Job 3: Frontend 测试（Next.js / TypeScript）
  # ────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

  # ────────────────────────────────────────────────────────────
  # Job 4: Docker 镜像构建验证
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, ai-service-test, frontend-test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: researchos/backend:latest

      - name: Build AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          load: true
          tags: researchos/ai-service:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: researchos/frontend:latest

      - name: Verify images created
        run: docker images | grep researchos

  # ────────────────────────────────────────────────────────────
  # Job 5: E2E 测试（Playwright + 真实后端/数据库）
  # 覆盖：注册 → 登录 → 登出 → 未登录访问受保护页重定向（含 middleware）
  # 说明：paper-upload.spec.ts 依赖 AI 全链路（ai-service/MQ/PDF），本地全栈验证，
  #       CI 只跑 auth.spec.ts 保证认证链路稳定。
  # ────────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start infrastructure (MySQL / Redis / RabbitMQ / Postgres)
        run: |
          docker compose -f infra/docker-compose.yml up -d mysql redis rabbitmq postgres
          # 等待 MySQL 首次初始化完成（自动执行 V1__init.sql 建表）
          for i in $(seq 1 40); do
            if docker compose -f infra/docker-compose.yml ps mysql | grep -q healthy; then
              echo "mysql healthy"; break
            fi
            sleep 3
          done
          docker compose -f infra/docker-compose.yml ps mysql | grep -q healthy \
            || (echo "mysql not healthy after wait"; docker compose -f infra/docker-compose.yml logs mysql | tail -50; exit 1)

      - name: Build backend
        working-directory: ./backend
        run: mvn package -DskipTests -q

      - name: Start backend
        working-directory: ./backend
        run: |
          nohup java -jar target/researchos-backend-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "backend is up"; break
            fi
            if ! kill -0 $! 2>/dev/null; then
              echo "backend process exited"; cat /tmp/backend.log; exit 1
            fi
            sleep 3
          done
          curl -sf http://localhost:8080/api/health > /dev/null \
            || (echo "backend not healthy"; cat /tmp/backend.log; exit 1)

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Start frontend
        working-directory: ./frontend
        run: |
          nohup npm start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/login > /dev/null 2>&1; then
              echo "frontend is up"; break
            fi
            sleep 3
          done
          curl -sf http://localhost:3000/login > /dev/null \
            || (echo "frontend not up"; cat /tmp/frontend.log; exit 1)

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (auth flow)
        working-directory: ./frontend
        run: npx playwright test tests/e2e/auth.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
